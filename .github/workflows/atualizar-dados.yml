# Quando o Geral.xlsx (ou o script) for enviado ao GitHub,
# este workflow gera o data.js automaticamente.
name: Atualizar data.js a partir do Excel

on:
  push:
    paths:
      - "Geral.xlsx"
      - "**/Geral.xlsx"
      - "prepare_data.py"
      - "**/prepare_data.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # token padrão já tem permissão de escrita (contents: write)
          token: ${{ secrets.GITHUB_TOKEN }}
          # busca histórico recente para conseguir rebase/push
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas openpyxl

      - name: Localizar pasta do projeto
        id: find
        run: |
          if [ -f "Geral.xlsx" ] && [ -f "prepare_data.py" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -f "docs/Geral.xlsx" ] && [ -f "docs/prepare_data.py" ]; then
            echo "dir=docs" >> $GITHUB_OUTPUT
          else
            XLSX=$(find . -name "Geral.xlsx" -not -path "./.git/*" | head -1)
            if [ -z "$XLSX" ]; then
              echo "ERRO: Geral.xlsx não encontrado no repositório"
              exit 1
            fi
            DIR=$(dirname "$XLSX")
            echo "dir=$DIR" >> $GITHUB_OUTPUT
          fi
          echo "Pasta do projeto: ${{ steps.find.outputs.dir }}"

      - name: Gerar data.js
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          echo "Pasta de trabalho: $(pwd)"
          ls -la Geral.xlsx prepare_data.py || true
          python prepare_data.py

      - name: Commit e push do data.js
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.js

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em data.js — base já estava atualizada."
            exit 0
          fi

          git commit -m "chore: atualiza data.js a partir do Geral.xlsx [skip ci]"

          # Evita erro "rejected (fetch first)": puxa o main remoto e aplica o commit por cima
          BRANCH="${GITHUB_REF_NAME:-main}"
          git pull --rebase origin "$BRANCH" || git pull --rebase origin main
          git push origin HEAD:"$BRANCH"
          echo "data.js enviado com sucesso."
