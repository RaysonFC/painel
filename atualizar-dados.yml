name: Atualizar data.js a partir do Excel

on:
  push:
    paths:
      - "Geral.xlsx"
      - "prepare_data.py"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas openpyxl
      - name: Generate data.js
        run: python prepare_data.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add food/data.js varejo/data.js
          git diff --staged --quiet || git commit -m "Atualiza data.js a partir do Excel"
          git push
